<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Welcome Tharu Education</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif}
body{background:#0f172a;color:white;overflow-x:hidden;min-height:100vh}
.rain{position:fixed;top:0;left:0;width:100%;height:100%;pointer-events:none;z-index:1}
.drop{position:absolute;width:2px;height:80px;background:linear-gradient(transparent,#38bdf8);animation:fall linear infinite}
@keyframes fall{to{transform:translateY(110vh)}}
.container{position:relative;z-index:2;max-width:1000px;margin:0 auto;padding:20px}
.header{text-align:center;padding:30px 10px}
.header h1{font-size:42px;background:linear-gradient(90deg,#38bdf8,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.header p{color:#94a3b8;margin-top:8px}
.tabs{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:20px 0}
.tab{padding:10px 20px;border-radius:999px;background:#1e293b;border:1px solid #334155;cursor:pointer;color:white;font-weight:600}
.tab.active{background:#0ea5e9;border-color:#0ea5e9}
.search{width:100%;padding:14px;border-radius:14px;border:1px solid #334155;background:#1e293b;color:white;outline:none;margin-bottom:20px;font-size:15px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:15px}
.card{background:#1e293b;border:1px solid #334155;border-radius:16px;padding:16px}
.card h3{font-size:16px;margin-bottom:6px;word-break:break-word}
.card p{font-size:13px;color:#94a3b8;margin-bottom:12px}
.btns{display:flex;gap:8px}
.btn{flex:1;text-align:center;padding:10px;border-radius:10px;text-decoration:none;font-weight:700;font-size:14px}
.view{background:#0ea5e9;color:white}
.down{background:#22c55e;color:white}
.empty{text-align:center;color:#94a3b8;padding:40px;background:#1e293b;border-radius:16px}
.count{text-align:center;color:#94a3b8;margin-bottom:15px;font-size:14px}
.footer{text-align:center;color:#64748b;font-size:13px;margin-top:30px;padding-bottom:20px}
.social{display:flex;justify-content:center;gap:12px;margin-top:20px}
.social a{padding:10px 18px;border-radius:999px;text-decoration:none;color:white;font-weight:700;font-size:14px}
.wa{background:#25D366}.fb{background:#1877F2}
</style>
</head>
<body>
<div class="rain" id="rain"></div>
<div class="container">
<div class="header"><h1>Tharu Education 📚</h1><p>Subject • Short Note • Papers - Saba ta free!</p></div>
<div class="social"><a class="wa" href="https://wa.me/94700000000" target="_blank">WhatsApp</a><a class="fb" href="https://facebook.com" target="_blank">Facebook</a></div>
<div class="tabs">
<button class="tab active" onclick="setCat('Subject',this)">📘 Subject</button>
<button class="tab" onclick="setCat('Short Note',this)">📝 Short Note</button>
<button class="tab" onclick="setCat('Papers',this)">📄 Papers</button>
</div>
<div class="count" id="count">Loading...</div>
<input class="search" id="search" placeholder="🔍 Hojanna... e.g. Maths, Science..." oninput="render()">
<div class="grid" id="grid"></div>
<div class="footer">© Tharu Education - Made with ❤️ by Nethmina Tharusha</div>
</div>

<script>
// --- SETTINGS ---
const USER = "wishadaone123";
const REPO = "Machn-education";
let currentCat = "Subject";
let allFiles = [];

function createRain(){
  let rain = document.getElementById('rain');
  for(let i=0;i<70;i++){
    let d=document.createElement('div'); d.className='drop';
    d.style.left=Math.random()*100+'%'; d.style.top='-100px';
    d.style.animationDuration=(0.6+Math.random()*0.7)+'s';
    d.style.animationDelay=Math.random()*2+'s'; d.style.opacity=0.3+Math.random()*0.5;
    rain.appendChild(d);
  }
}
createRain();

function setCat(cat, btn){
  currentCat = cat;
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  loadFiles();
}

async function loadFiles(){
  document.getElementById('grid').innerHTML = '<div class="empty">Loading... ⏳</div>';
  try{
    // GitHub API eken folder eke PDF tika gannawa
    let res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${encodeURIComponent(currentCat)}`);
    let data = await res.json();
    if(!Array.isArray(data)){ allFiles=[]; }
    else{
      allFiles = data.filter(f=>f.name.toLowerCase().endsWith('.pdf')).map(f=>({
        name: f.name.replace('.pdf','').replace(/[-_]/g,' '),
        url: f.download_url,
        size: (f.size/1024).toFixed(0)+' KB'
      }));
    }
  }catch(e){ allFiles=[]; }
  render();
}

function render(){
  let q = document.getElementById('search').value.toLowerCase();
  let filtered = allFiles.filter(f=>f.name.toLowerCase().includes(q));
  document.getElementById('count').innerText = `${currentCat} - ${filtered.length} documents thiyenawa`;
  let grid = document.getElementById('grid');
  if(filtered.length===0){
    grid.innerHTML = `<div class="empty">Thama mekata PDF na 😅<br><br>Admin PDF ekak dammama methana auto pennanawa.</div>`;
    return;
  }
  grid.innerHTML = filtered.map(f=>`
    <div class="card">
      <h3>📄 ${f.name}</h3>
      <p>${currentCat} • ${f.size} • Free Download</p>
      <div class="btns">
        <a class="btn view" href="${f.url}" target="_blank">View</a>
        <a class="btn down" href="${f.url}" download>Download</a>
      </div>
    </div>
  `).join('');
}

loadFiles();
</script>
</body>
</html>
