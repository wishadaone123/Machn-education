<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tharu Education</title>
<style>
*{box-sizing:border-box}body{margin:0;font-family:Arial;background:#0f0f2a;color:#fff;padding:15px}
.header{background:linear-gradient(90deg,#7b2ff7,#2f7bff);padding:20px;border-radius:15px}
.card{background:#1e1e3a;padding:15px;border-radius:12px;margin:10px 0;display:flex;justify-content:space-between;align-items:center;gap:10px}
button{background:#7b2ff7;color:#fff;border:0;padding:10px 14px;border-radius:8px;font-weight:bold;cursor:pointer}
select,input{padding:10px;border-radius:8px;border:0;width:100%;margin:5px 0;color:#000}
#adminBox{display:none;background:#1e1e3a;padding:15px;border-radius:12px;margin-top:15px}
a{color:#fff;text-decoration:none}
.filter{margin:10px 0;display:flex;gap:8px;flex-wrap:wrap}
.filter button{background:#333}
.filter button.active{background:#7b2ff7}
</style>
</head>
<body>
<div class="header"><h2>Welcome To Tharu Education 👋</h2><p>All documents visible to everyone. View & Download any file.</p></div>

<h3 id="count">Total Documents: Loading...</h3>
<div class="filter">
<button class="active" onclick="setFilter('All',this)">All</button>
<button onclick="setFilter('Papers',this)">Papers</button>
<button onclick="setFilter('Subject',this)">Subject</button>
<button onclick="setFilter('Short Note',this)">Short Note</button>
</div>

<div id="list"><p>Loading...</p></div>

<div id="adminBox">
<h3>🔐 Admin Upload (Oya Witharai)</h3>
<select id="cat"><option value="Subject">Subject</option><option value="Short Note">Short Note</option><option value="Papers">Papers</option></select>
<input type="file" id="fileInput" accept=".pdf">
<button onclick="upload()">Upload PDF</button>
<p id="status"></p>
</div>

<script>
const USER="wishadaone123", REPO="Machn-education";
let allFiles=[], currentFilter="All";

if(location.search.includes("admin=1")){
  document.getElementById("adminBox").style.display="block";
  let t = localStorage.getItem("gh_token");
  if(!t){ t = prompt("Admin Token eka danna (1 parai):"); if(t) localStorage.setItem("gh_token",t); }
}
function setFilter(f,btn){
  currentFilter=f;
  document.querySelectorAll('.filter button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active'); render();
}
function render(){
  let list = allFiles.filter(f=> currentFilter=="All" || f.cat==currentFilter);
  document.getElementById("count").innerText = "Total Documents: "+allFiles.length;
  if(list.length==0){ document.getElementById("list").innerHTML="<p>📁 Me category eke file na.</p>"; return; }
  document.getElementById("list").innerHTML = list.map(f=>{
    let viewUrl = `https://docs.google.com/viewer?url=${encodeURIComponent(f.download_url)}&embedded=true`;
    return `<div class="card"><div><b>${f.name}</b><br><small>${f.cat}</small></div>
    <div style="display:flex;gap:5px"><a href="${viewUrl}" target="_blank"><button>View</button></a>
    <a href="${f.download_url}" target="_blank"><button style="background:#00b894">Download</button></a></div></div>`;
  }).join("");
}
async function load(){
  try{
    allFiles=[];
    // OYA REPO EKE THIYENA FOLDERS 3NMA BALANNE - files kiyala ekak na!
    for(let folder of ["Papers","Subject","Short Note"]){
      const r = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${encodeURIComponent(folder)}?t=${Date.now()}`);
      if(!r.ok) continue;
      const files = await r.json();
      if(Array.isArray(files)){
        files.filter(f=>f.name.toLowerCase().endsWith(".pdf")).forEach(f=>{
          allFiles.push({name:f.name, cat:folder, download_url:f.download_url});
        });
      }
    }
    render();
  }catch(e){ document.getElementById("list").innerHTML="<p>Loading failed. Refresh karanna.</p>"; }
}
load();

async function upload(){
  const file = document.getElementById("fileInput").files[0];
  const cat = document.getElementById("cat").value;
  const token = localStorage.getItem("gh_token");
  if(!file) return alert("PDF ekak select karanna");
  if(!token) return alert("Token na!");
  document.getElementById("status").innerText="Uploading... ⏳";
  const fileName = file.name.replace(/ /g,"_");
  const reader = new FileReader();
  reader.onload = async ()=>{
    const base64 = reader.result.split(",")[1];
    const res = await fetch(`https://api.github.com/repos/${USER}/${REPO}/contents/${encodeURIComponent(cat)}/${encodeURIComponent(fileName)}`,{
      method:"PUT",
      headers:{Authorization:"token "+token,"Content-Type":"application/json"},
      body: JSON.stringify({message:"upload "+fileName, content: base64})
    });
    if(res.ok){ document.getElementById("status").innerText="✅ Uploaded! 10 sec inna..."; setTimeout(load,3000); }
    else{ document.getElementById("status").innerText="❌ Failed! Token eka check karanna"; }
  };
  reader.readAsDataURL(file);
}
</script>
</body>
</html>
